spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coffee_order}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
